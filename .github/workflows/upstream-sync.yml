name: "Windows: Sync Upstream & Release"

# Every 2 hours: bring upstream (patrickjaja/claude-desktop-extra) to this fork
# as a PULL REQUEST for review, and publish a new Windows build when Anthropic's
# Windows version moved. A run with nothing new is cheap: fetch, read RELEASES,
# decide, stop.
#
#   1. sync     - git merge of upstream master into the branch sync/upstream and
#                 a PR into master. Nothing reaches master until you merge that
#                 PR: upstream is a third party, and master is what gets built
#                 and published. Merging is your approval, and it releases. The PR body is made by
#                 scripts/sync-review-report.sh: the changed code, the added
#                 lines worth a look, and a prompt to paste into Claude for the
#                 review. The fork only ADDS files (its edits to upstream files
#                 live in scripts/windows/overlay/*.patch), so the merge never
#                 conflicts, except in .github/workflows/: upstream's Linux
#                 workflows are not used here, and a conflict there is
#                 resolved by keeping the fork's version.
#   2. build    - when Anthropic's Windows version (the RELEASES feed) is HIGHER
#                 than the highest published windows-v release, or by hand with
#                 force_build: Build Windows (build x64 + arm64, boot the x64
#                 build on a Windows runner) from master and publish
#                 windows-v<version>. A failed check publishes nothing.
#      release  - merging the sync PR (the release-merged job, on the PR's
#                 closed event) builds and publishes that merge commit. The PR
#                 already ran the same Build Windows checks before you merged,
#                 so the result is known in advance. Only a MERGED PR from
#                 sync/upstream in this repository qualifies.
#   3. report   - on any failure, an issue with the run link and a prompt to
#                 fix it with Claude (when Issues are enabled on the repo;
#                 otherwise the run summary). GitHub also emails the failed run.
#   4. pause    - while that failure issue is open, runs build and merge
#                 NOTHING, so a broken build is not retried every 2 hours and
#                 the fork stays where it is while you fix it. The run summary
#                 says how far behind Anthropic and upstream the fork is. Resume
#                 by running this workflow by hand with force_build ticked once
#                 it is fixed (a green run closes the issue), or by closing the
#                 issue. Without Issues enabled there is no pause flag.
#
# Needs a fine-grained personal access token as the SYNC_TOKEN secret
# (repository: this fork; permissions: Contents, Workflows and Pull requests
# read/write). Two reasons: commits that change upstream's own
# .github/workflows/ files need the `workflow` scope, and a PR opened with the
# default token does not start the Build Windows checks on it. Without it the
# sync cannot push such commits, and its PR runs no checks.

on:
  schedule:
    - cron: '51 */2 * * *' # every 2 hours, at minute 51
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Rebuild and republish the Windows release even if nothing changed or the failure pause is on'
        type: boolean
        default: false
  # Merging the sync PR is the approval: it builds and publishes what was merged.
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    # Scheduled and by-hand runs only; the pull_request trigger is for release-merged.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: read
      pull-requests: write
    outputs:
      merge_type: ${{ steps.sync.outputs.merge_type }}
      windows_latest: ${{ steps.win.outputs.latest }}
      windows_published: ${{ steps.win.outputs.published }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Look for an open failure issue
        id: failing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An open failure issue pauses the automatic runs. Issues disabled or
          # unreadable: no pause flag, the other triggers still apply.
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'in:title "Automatic update failed"' --json number -q '.[0].number // empty' 2>/dev/null || true)
          echo "issue=${n}" >> "$GITHUB_OUTPUT"

      - name: Check out master
        if: ${{ steps.failing.outputs.issue == '' || inputs.force_build }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Sync upstream into a pull request
        id: sync
        # Paused (failure issue open): leave everything where it is. A by-hand
        # run with force_build ticked goes ahead.
        if: ${{ steps.failing.outputs.issue == '' || inputs.force_build }}
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/patrickjaja/claude-desktop-extra.git
          git fetch -q upstream master
          type=none
          if ! git merge-base --is-ancestor upstream/master HEAD; then
            # Upstream has commits master lacks. They go to a PR, never to master.
            type=pr
            pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head sync/upstream --base master --state open --json number -q '.[0].number // empty')
            git fetch -q origin sync/upstream 2>/dev/null || true
            if [ -n "$pr" ] && git rev-parse -q --verify origin/sync/upstream >/dev/null \
               && git merge-base --is-ancestor upstream/master origin/sync/upstream \
               && git merge-base --is-ancestor origin/master origin/sync/upstream; then
              echo "PR #$pr already carries upstream and the current master; nothing to do." >> "$GITHUB_STEP_SUMMARY"
              echo "merge_type=pr" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Take the report script from master now: after the merge the working
            # tree holds upstream's files, and the script must be ours.
            git show origin/master:scripts/sync-review-report.sh > "$RUNNER_TEMP/sync-review-report.sh"
            git switch -q -C sync/upstream
            if ! git merge --no-edit upstream/master; then
              # Upstream's .github/workflows/ files are not used on this fork:
              # resolve every conflict there our way (keep ours, or stay deleted).
              conflicted=$(git diff --name-only --diff-filter=U)
              if grep -qv '^\.github/workflows/' <<<"$conflicted"; then
                echo "::error::Sync conflict outside .github/workflows/ (a fork commit changed an upstream file; move that change into a scripts/windows/overlay/ patch):"
                echo "$conflicted"
                exit 1
              fi
              while IFS= read -r f; do
                git checkout --ours -- "$f" 2>/dev/null && git add -- "$f" || git rm -q -- "$f"
              done <<<"$conflicted"
              git commit --no-edit -q
            fi
            # sync/upstream is this workflow's own branch: replace it each time.
            if ! git push --force origin HEAD:refs/heads/sync/upstream; then
              echo "::error::Could not push sync/upstream. If upstream changed .github/workflows/, add a SYNC_TOKEN secret (see the header of this workflow)."
              exit 1
            fi
            # The review report is built from the code, never from upstream's text.
            bash "$RUNNER_TEMP/sync-review-report.sh" origin/master HEAD | head -c 60000 > "$RUNNER_TEMP/pr-body.md"
            if [ -n "$pr" ]; then
              gh pr edit "$pr" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pr-body.md"
              echo "Sync: updated PR #$pr" >> "$GITHUB_STEP_SUMMARY"
            else
              if ! gh pr create -R "$GITHUB_REPOSITORY" --base master --head sync/upstream \
                   --title "Sync upstream ($(date -u +%F))" --body-file "$RUNNER_TEMP/pr-body.md"; then
                echo "::error::Could not open the PR. Allow Actions to create pull requests (Settings > Actions > General) or set SYNC_TOKEN."
                exit 1
              fi
              echo "Sync: opened a PR" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "merge_type=${type}" >> "$GITHUB_OUTPUT"
          echo "Sync: ${type}" >> "$GITHUB_STEP_SUMMARY"

      - name: Compare Windows versions
        id: win
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(curl -fsSL --retry 3 https://downloads.claude.ai/releases/win32/x64/RELEASES \
            | sed '1s/^\xEF\xBB\xBF//; s/\r$//' \
            | sed -n 's/^[0-9A-Fa-f]\{40\} AnthropicClaude-\(.*\)-full\.nupkg [0-9]*$/\1/p' | sort -V | tail -1)
          [ -n "$latest" ] || { echo "::error::no version in Anthropic's RELEASES"; exit 1; }
          published=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' \
            | sed -n 's/^windows-v//p' | sort -V | tail -1)
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "published=${published}" >> "$GITHUB_OUTPUT"
          echo "Windows: Anthropic ${latest}, published ${published:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TYPE: ${{ steps.sync.outputs.merge_type }}
          LATEST: ${{ steps.win.outputs.latest }}
          PUBLISHED: ${{ steps.win.outputs.published }}
          FAILING: ${{ steps.failing.outputs.issue }}
          FORCE: ${{ inputs.force_build }}
        run: |
          MERGE_TYPE="${MERGE_TYPE:-none}" # empty when the sync step was skipped (paused)
          # A new Windows version means Anthropic's is HIGHER than the highest
          # published one (or nothing is published yet). A lower or equal one
          # (a rollback, say) must not rebuild on every run.
          newer=false
          if [ -z "$PUBLISHED" ] || { [ "$LATEST" != "$PUBLISHED" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$PUBLISHED" | sort -V | tail -1)" = "$LATEST" ]; }; then
            newer=true
          fi
          # Paused after a failed build: report how far behind, build nothing.
          if [ -n "$FAILING" ] && [ "$FORCE" != "true" ]; then
            behind=$(gh api "repos/${GITHUB_REPOSITORY}/compare/master...patrickjaja:master" -q '.ahead_by' 2>/dev/null || echo "unknown")
            {
              echo "Paused: failure issue #${FAILING} is open, so nothing is built or merged automatically."
              echo "Anthropic: ${LATEST}, published ${PUBLISHED:-none} ($([ "$newer" = "true" ] && echo behind || echo up to date)). Upstream: ${behind} commit(s) ahead of this fork."
              echo "Fix it, then run this workflow by hand with force_build ticked (a green run closes the issue), or close the issue to resume."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An upstream sync (MERGE_TYPE=pr) is a PR awaiting review: it never
          # triggers a build; merging that PR does (release-merged).
          if [ "$newer" = "true" ] || [ "$FORCE" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Rebuilding and publishing the Windows release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build-windows.yml
    with:
      publish: true
      ref: master

  # The sync PR was merged: build and publish exactly the merge commit. Only a
  # merged PR from sync/upstream in THIS repository qualifies; a fork cannot
  # borrow the branch name, and a closed-but-unmerged PR does nothing.
  release-merged:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'sync/upstream'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    uses: ./.github/workflows/build-windows.yml
    with:
      publish: true
      ref: ${{ github.event.pull_request.merge_commit_sha }}

  report:
    needs: [sync, build, release-merged]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Report the failure
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SYNC: ${{ needs.sync.result }}
          BUILD: ${{ needs.build.result }}
          LATEST: ${{ needs.sync.outputs.windows_latest }}
        run: |
          set -uo pipefail
          title="Automatic update failed"
          body=$(cat <<EOF
          The scheduled [Upstream Sync run](${RUN_URL}) failed: sync **${SYNC}**, Windows build **${BUILD}** (Anthropic Windows ${LATEST:-unknown}). Nothing was published.

          To fix it with Claude, paste this into the project's open Claude Code thread (start a new one only if none is open, and archive a thread once its work is merged):

          > The Upstream Sync workflow failed: ${RUN_URL}. Automatic runs are paused while this issue is open, so nothing rebuilds until you fix it and restart it yourself:
          >
          > 1. Read the run's logs and find the cause.
          > 2. Fix it on a branch with a PR into the master branch of this fork, ${GITHUB_REPOSITORY} (gh pr create -R ${GITHUB_REPOSITORY} --base master), never to the upstream repositories. Follow AGENTS.md's patch strictness rules. If the Windows overlay no longer applies, re-fit the failing patch named in the error, in scripts/windows/overlay/ (see scripts/windows/prepare-sources.sh). If a Windows-set patch no longer matches the new bundle, re-fit it.
          > 3. When the PR's Build Windows checks are green, merge it.
          > 4. Only after that merge, start the rebuild: gh workflow run upstream-sync.yml -R ${GITHUB_REPOSITORY} -f force_build=true
          > 5. Watch that run (gh run list --workflow upstream-sync.yml --limit 1, then gh run watch with the run id). A green run publishes the Windows release and closes this issue by itself. Do not close the issue by hand.
          > 6. If that run fails too, read its logs, fix the cause the same way and repeat from step 2. Never start the rebuild before a fix is merged: every failed run files another report here.
          > 7. Tell the user the outcome: the published windows-v version, or what still fails.
          EOF
          )
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number,updatedAt -q '.[0] // empty | "\(.number) \(.updatedAt)"' 2>/dev/null)
          if [ -n "$existing" ]; then
            # A by-hand run can still fail while the issue is open: comment at
            # most once a day, so repeated failures do not flood the issue.
            num=${existing%% *}
            updated=$(date -d "${existing#* }" +%s 2>/dev/null || echo 0)
            if [ $(( $(date +%s) - updated )) -lt 86400 ]; then
              echo "Issue #$num was updated in the last 24 hours; not commenting again." >> "$GITHUB_STEP_SUMMARY"
            else
              gh issue comment "$num" -R "$GITHUB_REPOSITORY" --body "$body" ||
                echo "::warning::could not comment on issue #$num"
            fi
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body" ||
              echo "::warning::could not open an issue (Issues may be disabled on this repository); the report is in this run's summary"
          fi

  resolve:
    needs: [sync, build, release-merged]
    if: success() && (needs.build.result == 'success' || needs.release-merged.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'in:title "Automatic update failed"' --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$n" ]; then
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Fixed: [this run](${RUN_URL}) synced, built and published." || true
          fi
